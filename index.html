<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <meta name="application-name" content="KLS SameDay Office">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>KLS SameDay Office</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="dns-prefetch" href="//unpkg.com">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=22-logo">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=22-logo">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KLS SameDay">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="styles.css?v=35.4.4"><link rel="stylesheet" href="public-quote.css?v=35.4.4">
</head>
<body>
  <div id="app-splash" class="app-splash" aria-hidden="true"><div class="app-splash-mark">KLS</div><strong>SameDay Office</strong><span>Loading your business system…</span></div>
  <div id="app"></div>
  <button id="install-app" class="install-app-button" type="button" hidden>Install KLS Office</button>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=35.4.4"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
    let deferredInstallPrompt = null;
    const installButton = document.getElementById('install-app');
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault(); deferredInstallPrompt = event; installButton.hidden = false;
    });
    installButton.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null; installButton.hidden = true;
    });
    window.addEventListener('appinstalled', () => { installButton.hidden = true; });
    window.addEventListener('load', () => setTimeout(() => document.getElementById('app-splash')?.classList.add('hide'), 350));
  </script>
</body>
</html>
