<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <title>KLS SameDay Office — Offline</title>
  <link rel="icon" href="/icons/favicon-32.png">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6f8;color:#111318;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(460px,100%);padding:32px;border:1px solid #dfe3e8;border-radius:22px;background:#fff;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}.mark{width:88px;height:88px;margin:0 auto 20px;border-radius:22px;background:#111318;color:#fff;display:grid;place-items:center;font-weight:900;font-size:29px;letter-spacing:-2px}h1{font-size:27px;margin:0 0 10px}p{color:#667085;line-height:1.55;margin:0 0 22px}button{appearance:none;border:0;border-radius:12px;padding:13px 18px;background:#111318;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="mark">KLS</div><h1>You’re offline</h1><p>KLS SameDay Office needs an internet connection to load live jobs, quotes, tracking and accounts. Reconnect, then try again.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
